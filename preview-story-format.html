<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>PREVIEW story format · Air board</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
html, body { background: linear-gradient(165deg, #123a73 0%, #1d5aa8 42%, #2f7ed6 100%) !important; color: #f7f4ee; min-height: 100%; }
header.top { background: rgba(10, 28, 58, .88); border-bottom: 1px solid rgba(255,255,255,.28); }
.brand, .brand span, nav.main a { color: #fff; }
nav.main { display: flex; flex-wrap: wrap; gap: 12px; }
main.wrap { background: rgba(255,252,247,.96); color: #1c2430; border: 1px solid rgba(255,255,255,.7); border-radius: 18px; margin: 16px auto 28px; padding: 18px 18px 24px; max-width: 880px; }
.hour { margin-top: 22px; background: #fff; border: 1px solid #c9d7ea; border-radius: 14px; padding: 8px 12px 10px; }
.slot { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid #e1e8f2; color: inherit; font: inherit; padding: 10px 0; cursor: pointer; }
.slot .time { font-weight: 700; min-width: 46px; color: #1d4f91; }
.slot .tag { margin-left: auto; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #c4552a; }
.panel { background: #f4f8fd; border: 1px solid #b9cbe2; border-radius: 12px; padding: 12px 14px; margin: 8px 0 16px; }
.src { color: #1c2430; font-size: .95rem; font-weight: 700; font-style: italic; }
.actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.actions button, .kicker button, .actions a.btn { font: inherit; font-weight: 700; border: 1px solid #1d4f91; border-radius: 10px; padding: 8px 10px; background: #1d4f91; color: #fff; text-decoration: none; cursor: pointer; }
.actions button.ghost, .kicker button.ghost, .actions a.ghost { background: #fff; color: #1d4f91; }
.long { background: #fff; border: 1px solid #d5e0ee; border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
.kicker { padding: 10px 0; border-top: 1px solid #d5e0ee; }
.story h3.hl { font-size: 1.25rem; line-height: 1.25; margin: 0 0 6px; }
.story p.lede { font-weight: 600; margin: 0 0 8px; }
.story ul { margin: 6px 0 10px 20px; padding: 0; }
.story li { margin: 6px 0; }
.story .srcline { font-size: .95rem; margin: 8px 0; }
.story .srcline a { color: #1d4f91; word-break: break-all; }
.long h4 { margin: 0 0 8px; font-size: 1.05rem; }
.long p { margin: 0 0 10px; }
</style>
</head>
<body>

<main class="wrap">
<p class="stamp">Friday, Oct 9</p>
<h1>6:00–9:00</h1>
<p class="note">PREVIEW ONLY: new Story We Love / Care Don't Care format (sample card).</p>
<div id="board"></div>
</main>
<script>
const item = {
  headline: "The Cost Of The American Dream Is Now $5.3 Million",
  lede: "Living the American Dream now costs about $5.3-million over a lifetime, according to a new Investopedia study.",
  bullets: `- That’s 4.1% more than last year and the cost is climbing faster than wages grew.
- The figure includes the cost of owning a house, paying for new cars and retirement expenses, which make up almost 70% of the total.`,
  source: "Investopedia",
  url: "https://www.investopedia.com/the-2026-american-dream-cost-rises-4-percent-12154346",
  longHead: "The Full Story:",
  long: `Living the American Dream is still possible, but it doesn’t come cheap. A new Investopedia study finds that the cost is now $5.3-million over a lifetime. That’s up 4.1% from last year’s $5-million total, and that number is growing faster than our paychecks can cover it. The thing is, a full-time worker with a bachelor’s degree only earns about $3.6-million during their working years, according to the research.

So, what does that $5.3-million get you? Investopedia crunched the numbers to find out the lifetime cost of eight milestones and here’s how the cost of the American Dream breaks down:

- Owning a home - The cost of buying and financing a home is now the most expensive part of the American Dream at nearly $1.28-million ($1,275,782), with the median price for a single-family home over $420-thousand and a 30-year mortgage averaging 6.32%.
- Owning cars - Keeping two new cars in the driveway and replacing them every five years is the second-biggest cost, around $1.21-million over a lifetime, including insurance, maintenance, registration, and fuel for 15-thousand miles a year.
- Retirement - Brace yourself, this figure has climbed to over $1.2-million ($1,205,119). That’s for a retired married couple with a paid-off home who spends about $71,600 a year for 20 years.
- Raising two kids and putting them through college - This expense has skyrocketed 9.5% in just one year, jumping to almost $954-thousand today ($953,763). Just raising two kids through age 17 costs more than $700-thousand and college adds another $246-thousand for an in-state public university.
- Healthcare - This is the only category to cost less this year. Lifetime healthcare spending from age 22 to 85 is now $413,271, down from last year’s total of $414,208.
- Taking a yearly vacation - One trip a year for about $2,970 comes out to $187-thousand over a lifetime.
- Having pets - The estimated care for a cat and a dog adds up to nearly $41-thousand ($40,772).
- Throwing a wedding - It may be the cheapest category in the American Dream, but it’s just one day and the average cost for a wedding in the U.S. is now $38,800.`
};
let longOpen = new URLSearchParams(location.search).get("open") === "1";
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// light markup: **bold**, <b>/<strong>/<em>/<i> pass through, [text](url) links
function inline(s) {
  let t = esc(s);
  t = t.replace(/&lt;(\/?)(b|strong|em|i)&gt;/g, "<$1$2>");
  t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t;
}
// "Label - rest" bullet: bold the label unless already bolded
function bulletHtml(s) {
  if (/\*\*|<b>|<strong>/.test(s)) return inline(s);
  const m = s.match(/^(.+?) - (.*)$/s);
  return m ? `<strong>${inline(m[1])}</strong> - ${inline(m[2])}` : inline(s);
}
// blocks separated by blank lines; lines starting "- " or "* " are bullets
function blocks(text, labelBullets) {
  return String(text).trim().split(/\n\s*\n/).map(b => {
    const lines = b.split("\n").map(l => l.trim()).filter(Boolean);
    if (lines.every(l => /^[-*•] /.test(l))) {
      return "<ul>" + lines.map(l => "<li>" + (labelBullets ? bulletHtml(l.replace(/^[-*•] /, "")) : inline(l.replace(/^[-*•] /, ""))) + "</li>").join("") + "</ul>";
    }
    return "<p>" + inline(lines.join(" ")) + "</p>";
  }).join("");
}
function toggleLong() { longOpen = !longOpen; draw(); }
function storyFormatCard(it) {
  const src = `<p class="srcline"><strong>Source:</strong> ${esc(it.source)} (<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.url)}</a>)</p>`;
  const more = longOpen ? `<div class="long"><h4>${esc(it.longHead || "The Full Story:")}</h4>${blocks(it.long, true)}</div>` : "";
  return `<div class="panel story"><h3 class="hl">${esc(it.headline)}</h3><p class="lede">${inline(it.lede)}</p>${blocks(it.bullets, false)}${src}<div class="actions"><a class="btn ghost" href="${esc(it.url)}" target="_blank" rel="noopener">More here</a><button class="ghost" onclick="toggleLong()">${longOpen ? "Hide longer read" : "Longer read"}</button></div>${more}</div>`;
}
function draw() { document.getElementById("board").innerHTML = `<section class="hour"><h2>Story We Love</h2>${storyFormatCard(item)}</section>`; }
draw();
</script>
</body>
</html>
