html, body { background: linear-gradient(165deg, #123a73 0%, #1d5aa8 42%, #2f7ed6 100%) !important; color: #f7f4ee; min-height: 100%; }

.actions button.ghost, .kicker button.ghost, .actions a.ghost { background: #fff; color: #1d4f91; }

<p class="stamp">Thursday, Oct 8</p>
<h1>6:00–9:00</h1>
<p class="note">Longer read is the full summary of the source page again.</p>
<div id="board"></div>
</main>
<script>
const storyPool = [
  { title: "Kacey Musgraves is at the Moody Center tonight", read: "Middle of Nowhere Tour. William Beckmann opens. In Houston on Monday she covered Selena and closed with George Strait.", phone: "Who has tickets, and who is fine staying home?", source: "The Examiner", author: "Chad Cooper", url: "https://www.theexaminer.com/live-music-entertainment/concert-review-rhinestones-heartbreak-and-whole-lot-kacey", long: "Chad Cooper, entertainment editor at The Examiner, reviewed Kacey Musgraves on Monday, Oct. 5, at Toyota Center in Houston. She is from Sulphur Springs. The Middle of Nowhere Tour ran about 90 minutes. The stage is a circle in the middle of the floor with a star in the center and a moving ring, plus a smaller stage dressed like a weathered Texas bar with Middle of Nowhere signage. The set was 21 songs. She opened with Everybody Wants to Be a Cowboy, then Dry Spell, justified, and High Horse. Cooper calls the Selena cover, I Could Fall in Love, the emotional peak, not a novelty. She closed with George Strait's All My Ex's Live in Texas. Opener William Beckmann is from Del Rio. The printed setlist also includes Merry Go 'Round, Butterflies, Abilene, Back on the Wagon, I Believe in Ghosts, Uncertain TX, Horses and Divorces, Golden Hour, Loneliest Girl, Rhinestoned, Mexico Honey, Middle of Nowhere, Slow Burn, Space Cowboy, and Follow Your Arrow. During Rhinestoned, disco balls drop and she rides one over the crowd. Austin is tonight at the Moody Center." },
  { title: "Gruene Music and Wine Fest starts today", read: "40th year, today through Sunday. Robert Earl Keen is at Gruene Hall at 8. The Grapevine kickoff is free.", phone: "Who drives to Gruene, and who says that is a Saturday?", source: "New Braunfels Herald-Zeitung", author: "", url: "https://herald-zeitung.com/news/40th-annual-gruene-music-and-wine-fest-to-bring-tunes-and-tastes-thursday-through-sunday/article_086ea117-7790-404a-87f8-383f1de4c30d.html", long: "The New Braunfels Herald-Zeitung published this Oct. 7. No byline on the page. Gruene Music and Wine Fest starts Thursday and runs through Sunday. It is the 40th year and raises money for United Way of Comal and Guadalupe Counties. The fest has raised $2.9 million since it started. The goal this year is $3 million. Crystal Kinman of Momentous Concepts says 40 years of an event kept alive to give back speaks to Gruene. Thursday is a free kickoff at The Grapevine, 1612 Hunter Road, 5:30 to 8:30, with the Kreitz Band and ticketed tastings. Robert Earl Keen plays a ticketed show at Gruene Hall, 1281 Gruene Road, at 8. Friday is Stars and Guitars at Gruene Hall, a private silent auction from 5 to 8 with guitars signed by George Strait, Kacey Musgraves, and others, dinner by Gristmill, and a meet-and-greet with Shane Smith and the Saints, who play at 9. Saturday is free Tasting and Tunes at The Grapevine, noon to 6, with Ruben V and Aaron Stephens, plus a market from 11 to 6. The SteelDrivers play Gruene Hall at 9. Sunday is the All-Star Playlist at Gruene Hall, 1 to 7, with Kevin Fowler and Roger Creager as Dos Borrachos, Josh Ward, Tanner Usrey, Josh Baumann, Kat Hasty, Walker Montgomery, Carson Jeffrey, Kruse Brothers, Julianna Rankin, and Wynn Williams. Tickets are at gruenemusicandwinefest.org." },
  { title: "Fear Fair rebuilt the clown maze at Sign Bar", read: "East Austin, through Nov. 1. Matinee with no actors is $6.50. Live actors are $14.50. Family-friendly until 7.", phone: "Who does the maze, and who only wants the photo?", source: "Sign Bar", author: "", url: "https://signbartexas.com/", long: "Sign Bar's own page says Fear Fair is back Sept. 16 through Nov. 1 at the east Austin bar, and it is not last year's maze. They tore it down and rebuilt a haunted clown maze with new sets and more live actors. Weeknights have 3 scare actors. Fridays and Saturdays have 6. Every night from Oct. 26 to 31 has 6. The actor-free matinee walkthrough is $6.50. The live-actor maze is $14.50. Family-friendly until 7 p.m. Minors need a legal guardian. After 7, it is 21 and up. Austin Monthly's Oct. 8 to 11 weekend list puts the address at 9909 FM 969, Building 3, open select days through Nov. 1, and names the daytime walk for people who do not want jump scares. Photo ops and Halloween cocktails are part of the visit." },
  { title: "Foreigner is in Cedar Park tonight", read: "H-E-B Center, 2100 Avenue of the Stars. Doors 7:30. Last Austin-area date was about three years ago.", phone: "Who still knows every word, and who is sending their parents?", source: "Songkick", author: "", url: "https://www.songkick.com/concerts/43342361-foreigner-at-heb-center-at-cedar-park", long: "Songkick lists Foreigner tonight, Thursday, Oct. 8, at the H-E-B Center at Cedar Park, 2100 Avenue of the Stars, Cedar Park. Doors are 7:30. Capacity is listed at 8,000. Songkick says the last Austin-area date was about three years ago. Tickets are on sale through SeatGeek. JamBase also lists the show at 7:30 p.m. The same venue page has Foreigner on the Cedar Park calendar for this week. This is the classic-rock room, not a club date." },
  { title: "ACL Weekend 2 opens Friday", read: "Zilker, Friday through Sunday. Kings of Leon at 8:15. Charli XCX at 8:40. You cannot see both closers.", phone: "Who is going, and who already did Weekend 1?", source: "Ones to Watch", author: "", url: "https://onestowatch.com/live/austin-city-limits-weekend-two/", long: "Ones to Watch's Weekend 2 guide says Austin City Limits runs Friday, Oct. 9, through Sunday, Oct. 11, at Zilker. Friday hours are noon to 10 p.m. Saturday and Sunday gates open at 11. Kings of Leon are the Weekend 2 exclusive on the T-Mobile Stage at 8:15 Friday. That slot was Skrillex on Weekend 1. Charli XCX starts at 8:40 on the American Express Stage, so the closers overlap. Saturday is Lorde at 8:15 against Rufus Du Sol at 8:30. The festival is in its 25th year. Daily capacity is about 75,000. ACL Nights aftershows are separate tickets and do not need a wristband." },
  { title: "Texas-OU watch parties are Saturday", read: "Kickoff is 2:30. Fairmont rooftop, Hole in the Wall, Scholz, and Meanwhile are already on the list.", phone: "Who is watching in town, and who is going to Dallas?", source: "Austin Monthly", author: "", url: "https://www.austinmonthly.com/7-fun-things-to-do-in-austin-this-weekend-oct-8-11/", long: "Austin Monthly's Oct. 8 to 11 weekend list, published Oct. 6, puts the Red River Rivalry on Saturday at 2:30. Named watch parties are Fairmont Austin, Hole in the Wall, Scholz Garten, and Meanwhile Brewing. The Austin Chronicle listing for the Fairmont party says Saturday, Oct. 10, noon to 6, rooftop pool, a DJ, a Verdadero Tequila pop-up, and two 80-inch TVs. Adults 13 and up start at $60. Kids 3 to 12 start at $30. The address is 101 Red River. Austin Monthly does not print a score prediction. It is a where-to-watch item." }
];
const kickerPool = [
  { line: "Two guys in Charlotte got stopped for driving an actual couch.", more: "The couch was on two scooters. Police said leave the furniture to IKEA.", source: "UPI", author: "Ben Hooper", url: "https://www.upi.com/Odd_News/2026/10/05/nc-us-Charlotte-Mecklenburg-couch-scooters/8751791210974/", long: "Ben Hooper wrote this for UPI on Oct. 5. Charlotte-Mecklenburg police posted that officers stopped two men going down South Tryon Street on a couch. The photo shows the couch balanced across two electric scooters. Police called it a first and told people to put safety first, even if what they are driving is a couch. They asked whether the shock of seeing it would make other drivers lose focus. It was not clear if the men were cited. The closer from police is that mobile furniture displays should be left to IKEA." },
  { line: "A Canadian buoy floated more than 3,000 miles and washed up in Ireland.", more: "About 3.8 tons. Mayo says if Canada wants it back, come get it.", source: "UPI", author: "Ben Hooper", url: "https://www.upi.com/Odd_News/2026/10/06/ireland-county-mayo-canadian-coast-guard-buoy/1221791304125/", long: "Ben Hooper wrote this for UPI on Oct. 6. Mayo County Council said a Canadian Coast Guard buoy, about 3.8 tons, washed up on Achill Island. After they called the Canadian Coast Guard, the council was told the buoys are very friendly and sometimes travel far from home. They want it moved off the beach so it does not go back in the water and hit a boat. David Mellett, the council's marine director, said the find is also a reminder of Mayo's links to Canada. The exact distance is unknown, but it had to cross more than 3,000 miles. The council's line is that if the Canadians want the buoy back, they may have to make a special trip to Mayo to collect it." },
  { line: "An Ohio man forgot a lottery ticket in a bag for four months. It was worth $50,000.", more: "Numbers were 1-7-9-2-9. He took home $36,625 after taxes.", source: "UPI", author: "Ben Hooper", url: "https://www.upi.com/Odd_News/2026/10/06/lotto-Ohio-Lottery-forgotten-Pick-5-ticket/4401791305171/", long: "Ben Hooper wrote this for UPI on Oct. 6. Cleveland resident Wayne Hilliard bought a Pick 5 ticket for the June 16 drawing at an Exxon on Euclid Avenue in East Cleveland and put it in a bag. It sat there almost four months. When he found it, the numbers 1-7-9-2-9 matched in order. He collected $50,000 at Ohio Lottery headquarters on Monday and took home $36,625 after taxes." },
  { line: "An Idaho man moved 51 malt balls with a straw in one minute.", more: "David Rush already has more than 200 records. He is waiting on Guinness.", source: "UPI", author: "Ben Hooper", url: "https://www.upi.com/Odd_News/2026/10/06/guinness-world-records-david-rush-malt-balls-straw/4211791303328/", long: "Ben Hooper wrote this for UPI on Oct. 6. David Rush of Idaho, who holds more than 200 Guinness titles, saw that Jack Welsh had set the malt-ball straw record at 32 on April 17. At a pool party in Kansas City, Rush set two bowls 30 centimeters apart and used a straw. His first try was thrown out because he bumped a bowl. He moved 52, but video showed the last one missed the minute, so he claimed 51 and is waiting on Guinness. He compared it to moving items with toothpicks plus the breath control from catching ping-pong balls in his mouth." }
];
const docPool = [
  { q: "Over-50 agility test: socks, one foot at a time.", how: "From the Doc. No sitting. No leaning. Do it in studio first." },
  { q: "What strange item permanently lives in your car?", how: "From the Doc. Caller names the object first. Cone, wedding dress, bowling ball." },
  { q: "What mundane thing hypnotizes you?", how: "From the Doc. Dirt grader, car wash, lawn robot, tortilla machine." },
  { q: "They sent me an Uber.", how: "From the Doc. What happened that made someone send the ride?" },
  { q: "Optimus gets one chore forever. What is it?", how: "From the Doc. Laundry, yard, dishes, or the H-E-B run." },
  { q: "That is not your pet.", how: "From the Doc. Raccoon, squirrel, deer, fox." },
  { q: "Do your spouse. Then get the spouse on.", how: "From the Doc. 20 seconds." },
  { q: "Empty your pockets.", how: "From the Doc. Most inexplicable item wins." }
];
const slots = ["s610", "s705", "s810"];
let open = localStorage.getItem("air-open") || "";
let longOpen = localStorage.getItem("air-long") || "";
let storySkip = JSON.parse(localStorage.getItem("air-story-skip") || "{}");
let kickerSkip = JSON.parse(localStorage.getItem("air-kicker-skip") || "[0,1,2,3]");
let benched = JSON.parse(localStorage.getItem("air-bench") || "[]");
let used = JSON.parse(localStorage.getItem("air-used") || "[]");
function save() { localStorage.setItem("air-open", open); localStorage.setItem("air-long", longOpen); localStorage.setItem("air-story-skip", JSON.stringify(storySkip)); localStorage.setItem("air-kicker-skip", JSON.stringify(kickerSkip)); localStorage.setItem("air-bench", JSON.stringify(benched)); localStorage.setItem("air-used", JSON.stringify(used)); }
function storyFor(slot) { const n = storySkip[slot] || 0; const usedTitles = slots.filter(s => s !== slot).map(s => storyPool[(storySkip[s] || 0) % storyPool.length].title); let i = n; for (let k = 0; k < storyPool.length; k++) { const pick = storyPool[i % storyPool.length]; if (!usedTitles.includes(pick.title)) return pick; i++; } return storyPool[n % storyPool.length]; }
function kickerAt(i) { return kickerPool[(kickerSkip[i] || i) % kickerPool.length]; }
function newStory(slot) { storySkip[slot] = (storySkip[slot] || 0) + 1; open = slot; longOpen = ""; save(); draw(); }
function newKicker(i) { kickerSkip[i] = (kickerSkip[i] || i) + 1; open = "cdc"; longOpen = ""; save(); draw(); }
function toggleLong(id) { longOpen = longOpen === id ? "" : id; save(); draw(); }
function available() { return docPool.filter(bit => !benched.includes(bit.q)); }
function pick(n) { const pool = available(); return pool[n] || pool[0] || docPool[0]; }
function bench(q) { if (!benched.includes(q)) benched.unshift(q); save(); draw(); }
function markUsed(q) { if (used.includes(q)) used = used.filter(x => x !== q); else used.push(q); save(); draw(); }
function toggle(id) { open = open === id ? "" : id; save(); draw(); }
function row(time, label, id, tag) { return `<button class="slot" onclick="toggle('${id}')"><span class="time">${time}</span><span>${label}</span><span class="tag">${tag}</span></button>`; }
function sourceLine(item, id) { const more = longOpen === id ? `<div class="long"><p>${item.long}</p></div>` : ""; const who = item.author ? item.source + ", " + item.author : item.source; return `<p class="src"><em><strong>${who}</strong></em></p><div class="actions"><a class="btn ghost" href="${item.url}" target="_blank" rel="noopener">More here</a><button class="ghost" onclick="toggleLong('${id}')">${longOpen === id ? "Hide longer read" : "Longer read"}</button></div>${more}`; }
function storyCard(slot, extra) { const s = storyFor(slot); return `<div class="panel"><h3>${s.title}</h3><p>${s.read}</p><p>Phone: ${s.phone}</p>${extra || ""}${sourceLine(s, "long-" + slot)}<div class="actions"><button onclick="newStory('${slot}')">New story</button></div></div>`; }
function docCard(bit) { const struck = used.includes(bit.q) ? "text-decoration:line-through" : ""; const q = bit.q.replace(/'/g, ""); return `<div class="panel"><h3 style="${struck}">${bit.q}</h3><p>${bit.how}</p><div class="actions"><button onclick="markUsed('${q}')">${used.includes(bit.q) ? "Undo" : "Used"}</button><button class="ghost" onclick="bench('${q}')">Bench it</button></div></div>`; }
function draw() {
  const a = storyFor("s610"), b = storyFor("s705"), c = storyFor("s810");
  const ks = [0,1,2,3].map(kickerAt);
  const d1 = pick(0), d2 = pick(1), d3 = pick(2), d4 = pick(3);
  const cdc = ks.map((k, i) => `<div class="kicker"><b>${k.line}</b><p>${k.more}</p>${sourceLine(k, "k" + i)}<button onclick="newKicker(${i})">New story</button></div>`).join("");
  document.getElementById("board").innerHTML = `<section class="hour"><h2>6:00</h2>${row("6:00", "Intro, then the first thing that made Tricia laugh", "intro", "locked")}${row("6:10", "Replay: " + a.title, "s610", "story")}${open === "s610" ? storyCard("s610") : ""}${row("6:25", "Replay from Yesterday", "replay", "locked")}${row("6:35", "Tease: " + ks[0].line, "cdc", "tied")}${row("6:40", "Care Don't Care", "cdc", "open")}${open === "cdc" ? `<div class="panel"><h3>Care Don't Care</h3>${cdc}</div>` : ""}${row("6:52", "Last Laugh", "laugh6", "locked")}</section><section class="hour"><h2>7:00</h2>${row("7:05", b.title, "s705", "story")}${open === "s705" ? storyCard("s705", "<p>Then the setup: Minute to Win It is at 7:10.</p>") : ""}${row("7:10", "Minute to Win It", "m2w", "locked")}${row("7:26", d1.q, "d1", "doc")}${open === "d1" ? docCard(d1) : ""}${row("7:32", "Phones if lit. Doc bit waits.", "phones7", "phones")}${row("7:40", d2.q, "d2", "doc")}${open === "d2" ? docCard(d2) : ""}${row("7:52", "Last Laugh", "laugh7", "locked")}</section><section class="hour"><h2>8:00</h2>${row("8:05", "Tease: " + c.title, "s810", "tied")}${row("8:10", c.title, "s810", "story")}${open === "s810" ? storyCard("s810") : ""}${row("8:26", d3.q, "d3", "doc")}${open === "d3" ? docCard(d3) : ""}${row("8:32", "Phones if lit. Doc bit waits.", "phones8", "phones")}${row("8:40", d4.q, "d4", "doc")}${open === "d4" ? docCard(d4) : ""}${row("8:52", "Last Laugh", "laugh8", "locked")}</section>`;
}
draw();
</script>
</body>
