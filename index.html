<p class="stamp">Friday, Oct 9</p>
<h1>6:00–9:00</h1>
<p class="note">Longer read is the full summary of the source page again.</p>
<div id="board"></div>
</main>
<script>
const storyPool = [
  { title: "ACL Weekend 2 opens today, and Zilker is mud and dust", read: "Gates at noon. Dry and upper 80s, not last weekend's rain. Grass is gone, so it is mud in spots and dust in others. Kings of Leon at 8:15, Charli XCX at 8:40. You cannot see both.", phone: "Who is in Zilker today, and who already did Weekend 1?", source: "Austin American-Statesman", author: "Mary Wasson", url: "https://www.statesman.com/weather/article/austin-weather-acl-festival-weekend-22462894.php", long: "Mary Wasson, newsroom meteorologist, wrote this for the Austin American-Statesman on Oct. 8. She says Weekend 2 of ACL Fest is here after a rainy, muddy first weekend, and the forecast is the opposite: warm, dry, and nearly perfect, except Zilker will be muddy in some spots and dusty in others. Much of the grass is gone, so dirt will kick up. She says plan the outfit and the shoes, and maybe bring a bandana. Friday starts mostly clear, light north wind, upper 60s to near 70, then middle to upper 80s under full sun. Afternoon north winds can gust 20 to 25 mph and stir the dust. Humidity stays low. Hurricane Isaias is in the Gulf, tracking toward Alabama and Florida, and Texas stays on the dry side. Saturday gates open at 11. Morning is a little above the early-October average of 64, about 80 at gate time, light north-northeast wind 3 to 10 mph, afternoon high 87. Sunday turns more humid with a south wind, morning near 70, afternoon near 90. Scattered showers can start Monday afternoon." },
  { title: "Fabrik and Kappo Kappo just got Michelin stars", read: "Announced Thursday. Fabrik is the vegan tasting menu in Tarrytown. Kappo Kappo is the twins inside the Proper. La Barbecue lost the star it had for two years. Austin now has seven.", phone: "Who has actually been, and who is just going to say they knew?", source: "Austin American-Statesman", author: "Matthew Odam", url: "https://www.statesman.com/entertainment/dining/article/austin-michelin-stars-fabrik-kappo-22464806.php", long: "Matthew Odam, restaurant critic, wrote this for the Austin American-Statesman on Oct. 8. Michelin added two Austin restaurants and Goldee's Bar-B-Q in Fort Worth on Thursday morning. Fabrik, a vegan tasting-menu place that was a Statesman Top 25 in 2025, got a star. Chef Je Wallerstein worked in Australia, Berlin, and Copenhagen, opened in East Austin, and moved to Tarrytown this summer. The menu is eight courses, local and seasonal, with flavors from Mexico, Italy, Scandinavia, and Japan. It was already a hard reservation. Kappo Kappo, from twin brothers Haru and Gohei Kishi, is inside the Proper Hotel and mixes French and Japanese, including sushi and braised beef. Sixteen of 17 Texas restaurants that had stars in 2024 and 2025 kept them. La Barbecue lost the star it held for two years and is now recommended. Austin has seven starred restaurants, Houston six, San Antonio three, Dallas two, Fort Worth one. No new Austin Bib Gourmands. The city still has 15. Din Ho Chinese BBQ is the only new Austin recommended restaurant. Garrison at the Fairmont is no longer recommended. The announcement was a press release, not the Houston gala of the last two years. It is the last act of a three-year Texas contract. The state paid $1.35 million, and each of five cities paid $270,000. Talks on a new deal are underway." },
  { title: "Austin Oktoberfest is $20 on Saturday", read: "German Free School, 507 E. 10th, 11 to 7. Kids free. Bushy Creek Band, the Walburg Boys, and Yodel Blitz. Not the Scholz one.", phone: "Who is doing Oktoberfest, and who is doing ACL?", source: "ATX Things", author: "", url: "https://austintexasthings.com/article/austin-weekend-without-acl-oktoberfest-ballet-pumpkin-nights-oct-2026", long: "ATX Things published this Oct. 8. No byline on the page. Austin Oktoberfest is Saturday, Oct. 10, 11 a.m. to 7 p.m. at the German Free School, 507 E. 10th St. The German-Texan Heritage Society lists admission at $20, kids free. The page notes the society says 12 and under in one place and under 12 in another. The society calls it the longest-running traditional Oktoberfest in town and quotes the Austin Chronicle. Music is Bushy Creek Band 11 to 1, Walburg Boys 1 to 5, and Yodel Blitz 5 to 7. Beer is Paulaner, Hacker-Pschorr, and Hofbrau. Wine is William Chris. Food is from IM Catering. The building is the 1857 German Free School. Eventbrite says sales can end soon, and the society says sales are final. The same piece also lists Ballet Austin TWO, The Seventh Night Sky, 45 minutes, every ticket $25, Saturday and Sunday at 2 and 4:30 at the Butler Center, and Pumpkin Nights at Pioneer Farms, 10621 Pioneer Farms Dr., through Oct. 31, weekend adult tickets $34 to $38. The forecast in the piece is dry, highs near 90 to 92." }
];
const kickerPool = [
  { line: "A 1965 class ring came out of an Alabama sewer and still fits.", more: "He gave it to his high school sweetheart. She lost it down the sink across the street.", source: "UPI", author: "Ben Hooper", url: "https://www.upi.com/Odd_News/2026/10/08/class-ring-sewer-Sheffield-Alabama/7991791477667/", long: "Ben Hooper wrote this for UPI on Oct. 8. Junior Riner, an operator at the Sheffield Wastewater Plant, got a Burrell-Slater High School Class of 1965 ring from a crew that found it while clearing a clogged sewer main. The school for Black students in Florence closed in 1969. The ring had the initials OJM. Riner posted in an alumni Facebook group. Months later his son-in-law found a photo of Oscar James Meredith. The son-in-law's father, a city council member, helped find Meredith's daughter, April Meredith Moore. Meredith, now 79, said he gave the ring to his sweetheart Anna, who later became his wife. She told him she lost it a few years before they married. She died a few years ago. The sewer was across the street from Anna's childhood home, so it likely went down the sink. Riner handed it back. It still fits. Meredith said it goes in a display case." },
  { line: "A 61-year-old grandma held a plank for five hours.", more: "DonnaJean Wilde of Alberta. Her old record was 4 hours and 30 minutes. Guinness has not signed off yet.", source: "ABC News", author: "Yi-Jin Yu", url: "https://abcnews.com/family/story/grandmother-12-holds-plank-5-hours-new-world/?id=137091775", long: "Yi-Jin Yu wrote this for ABC News on Oct. 8. DonnaJean Wilde, 61, a grandmother of 12 from Alberta, Canada, held an abdominal plank for five hours at the Huntsman World Senior Games in Utah. Guinness told ABC her existing women's record, set March 21, 2024, is 4 hours, 30 minutes, and 11 seconds. Guinness has the new application and has not declared it yet. She said she always wondered if she could get to five hours. World Senior Games said the attempt started at 3:03 p.m. Mountain Time. Judges rotated every hour until 8:03. Training included having her 3-year-old granddaughter, Rose, lie on her back while she planked. If it counts, it would be her third Guinness title." },
  { line: "Firefighters pulled an iguana named Tasslehoff out of a Kansas tree.", more: "He had been loose for about a week and would not come down.", source: "UPI", author: "Ben Hooper", url: "https://www.upi.com/Odd_News/2026/10/08/spring-hill-kansas-iguana-tree/7311791476751/", long: "Ben Hooper wrote this for UPI on Oct. 8. The Spring Hill Fire Department in Kansas said crews were called to catch an iguana that had been loose about a week. The lizard, named Tasslehoff, had climbed a tree and would not come down. Firefighters borrowed a catch pole from Spring Hill police. The department said one member is experienced with reptiles, so they brought Mr. Tasslehoff down with teamwork." },
  { line: "Idaho cooked 1,474 pounds of french fries and called it a world record.", more: "Fifty chefs, six fryers, 1,700 pounds of potatoes. Then they served them.", source: "UPI", author: "Ben Hooper", url: "https://www.upi.com/Odd_News/2026/10/07/Guinness-World-Records-largest-serving-french-fries/1951791396507/", long: "Ben Hooper wrote this for UPI on Oct. 7. The Idaho Potato Commission and the chain Spud Daddy cooked a 1,474-pound serving of fresh-cut fries at Boise Potato Days and called it a Guinness record. A team of 50 chefs turned 1,700 pounds of Idaho potatoes into 1,475 pounds of fries with six fryers. Jamey Higham, president and CEO of the commission, said if anyone holds the largest-serving record, it should be Idaho. The fries were served to the crowd after the weigh-in." }
];
const docPool = [
  { q: "Trail of Lights tickets are already on sale.", how: "From the Doc. Who already bought, and who waits until the first cold night?" },
  { q: "That is not your pet.", how: "From the Doc. Raccoon, squirrel, deer, fox, armadillo. When did it start acting like family?" },
  { q: "What problem do people try to solve the second you mention it?", how: "From the Doc. Back, sleep, weight, allergies. The advice you have heard 100 times." },
  { q: "Wake-up service. Call the sleeping kid.", how: "From the Doc. Parents give a nickname, a chore, and why they have to get up." },
  { q: "Over-50 agility test: socks, one foot at a time.", how: "From the Doc. No sitting. No leaning. Do it in studio first." },
  { q: "What strange item permanently lives in your car?", how: "From the Doc. Caller names the object first. Cone, wedding dress, bowling ball." },
  { q: "What mundane thing hypnotizes you?", how: "From the Doc. Dirt grader, car wash, lawn robot, tortilla machine." },
  { q: "They sent me an Uber.", how: "From the Doc. What happened that made someone send the ride?" }
];
const slots = ["s610", "s705", "s810"];
let open = localStorage.getItem("air-open") || "";
let longOpen = localStorage.getItem("air-long") || "";
let storySkip = JSON.parse(localStorage.getItem("air-story-skip") || "{}");
let kickerSkip = JSON.parse(localStorage.getItem("air-kicker-skip") || "[0,1,2,3]");
let benched = JSON.parse(localStorage.getItem("air-bench") || "[]");
let used = JSON.parse(localStorage.getItem("air-used") || "[]");
function save() { localStorage.setItem("air-open", open); localStorage.setItem("air-long", longOpen); localStorage.setItem("air-story-skip", JSON.stringify(storySkip)); localStorage.setItem("air-kicker-skip", JSON.stringify(kickerSkip)); localStorage.setItem("air-bench", JSON.stringify(benched)); localStorage.setItem("air-used", JSON.stringify(used)); }
function storyFor(slot) { const n = storySkip[slot] || 0; const usedTitles = slots.filter(s => s !== slot).map(s => storyPool[(storySkip[s] || 0) % storyPool.length].title); let i = n; for (let k = 0; k < storyPool.length; k++) { const pick = storyPool[i % storyPool.length]; if (!usedTitles.includes(pick.title)) return pick; i++; } return storyPool[n % storyPool.length]; }
function kickerAt(i) { return kickerPool[(kickerSkip[i] || i) % kickerPool.length]; }
function newStory(slot) { storySkip[slot] = (storySkip[slot] || 0) + 1; open = slot; longOpen = ""; save(); draw(); }
function newKicker(i) { kickerSkip[i] = (kickerSkip[i] || i) + 1; open = "cdc"; longOpen = ""; save(); draw(); }
function toggleLong(id) { longOpen = longOpen === id ? "" : id; save(); draw(); }
function available() { return docPool.filter(bit => !benched.includes(bit.q)); }
function pick(n) { const pool = available(); return pool[n] || pool[0] || docPool[0]; }
function bench(q) { if (!benched.includes(q)) benched.unshift(q); save(); draw(); }
function markUsed(q) { if (used.includes(q)) used = used.filter(x => x !== q); else used.push(q); save(); draw(); }
function toggle(id) { open = open === id ? "" : id; save(); draw(); }
function row(time, label, id, tag) { return `<button class="slot" onclick="toggle('${id}')"><span class="time">${time}</span><span>${label}</span><span class="tag">${tag}</span></button>`; }
function sourceLine(item, id) { const more = longOpen === id ? `<div class="long"><p>${item.long}</p></div>` : ""; const who = item.author ? item.source + ", " + item.author : item.source; return `<p class="src"><em><strong>${who}</strong></em></p><div class="actions"><a class="btn ghost" href="${item.url}" target="_blank" rel="noopener">More here</a><button class="ghost" onclick="toggleLong('${id}')">${longOpen === id ? "Hide longer read" : "Longer read"}</button></div>${more}`; }
function storyCard(slot, extra) { const s = storyFor(slot); return `<div class="panel"><h3>${s.title}</h3><p>${s.read}</p><p>Phone: ${s.phone}</p>${extra || ""}${sourceLine(s, "long-" + slot)}<div class="actions"><button onclick="newStory('${slot}')">New story</button></div></div>`; }
function docCard(bit) { const struck = used.includes(bit.q) ? "text-decoration:line-through" : ""; const q = bit.q.replace(/'/g, ""); return `<div class="panel"><h3 style="${struck}">${bit.q}</h3><p>${bit.how}</p><div class="actions"><button onclick="markUsed('${q}')">${used.includes(bit.q) ? "Undo" : "Used"}</button><button class="ghost" onclick="bench('${q}')">Bench it</button></div></div>`; }
function draw() {
  const a = storyFor("s610"), b = storyFor("s705"), c = storyFor("s810");
  const ks = [0,1,2,3].map(kickerAt);
  const d1 = pick(0), d2 = pick(1), d3 = pick(2), d4 = pick(3);
  const cdc = ks.map((k, i) => `<div class="kicker"><b>${k.line}</b><p>${k.more}</p>${sourceLine(k, "k" + i)}<button onclick="newKicker(${i})">New story</button></div>`).join("");
  document.getElementById("board").innerHTML = `<section class="hour"><h2>6:00</h2>${row("6:00", "Intro, then the first thing that made Tricia laugh", "intro", "locked")}${row("6:10", "Replay: " + a.title, "s610", "story")}${open === "s610" ? storyCard("s610") : ""}${row("6:25", "Replay from Yesterday", "replay", "locked")}${row("6:35", "Tease: " + ks[0].line, "cdc", "tied")}${row("6:40", "Care Don't Care", "cdc", "open")}${open === "cdc" ? `<div class="panel"><h3>Care Don't Care</h3>${cdc}</div>` : ""}${row("6:52", "Last Laugh", "laugh6", "locked")}</section><section class="hour"><h2>7:00</h2>${row("7:05", b.title, "s705", "story")}${open === "s705" ? storyCard("s705", "<p>Then the setup: Minute to Win It is at 7:10.</p>") : ""}${row("7:10", "Minute to Win It", "m2w", "locked")}${row("7:26", d1.q, "d1", "doc")}${open === "d1" ? docCard(d1) : ""}${row("7:32", "Phones if lit. Doc bit waits.", "phones7", "phones")}${row("7:40", d2.q, "d2", "doc")}${open === "d2" ? docCard(d2) : ""}${row("7:52", "Last Laugh", "laugh7", "locked")}</section><section class="hour"><h2>8:00</h2>${row("8:05", "Tease: " + c.title, "s810", "tied")}${row("8:10", c.title, "s810", "story")}${open === "s810" ? storyCard("s810") : ""}${row("8:26", d3.q, "d3", "doc")}${open === "d3" ? docCard(d3) : ""}${row("8:32", "Phones if lit. Doc bit waits.", "phones8", "phones")}${row("8:40", d4.q, "d4", "doc")}${open === "d4" ? docCard(d4) : ""}${row("8:52", "Last Laugh", "laugh8", "locked")}</section>`;
}
draw();
</script>
