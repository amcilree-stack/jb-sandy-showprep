body { background: linear-gradient(165deg, #123a73 0%, #1d5aa8 42%, #2f7ed6 100%); color: #f7f4ee; }

nav.main { flex-wrap: wrap; gap: 12px; }
main.wrap { background: rgba(255,252,247,.96); color: #1c2430; border: 1px solid rgba(255,255,255,.7); border-radius: 18px; margin: 16px auto 28px; padding: 18px 18px 24px; box-shadow: 0 10px 28px rgba(8, 24, 52, .28); }
.hour { margin-top: 22px; background: #fff; border: 1px solid #c9d7ea; border-radius: 14px; padding: 8px 12px 10px; }

<main class="wrap">
<p class="stamp">Thursday, Oct 8</p>
<h1>6:00–9:00</h1>
<p class="note">Longer read is a summary of the source page, not a longer tease.</p>
<div id="board"></div>
</main>
<script>
const storyPool = [
  { title: "ACL Weekend 2 starts Friday", read: "Zilker, Friday through Sunday. Weekend 1 already happened. Rain or shine unless it gets dangerous.", phone: "Who is going, and who is sitting this weekend out?", source: "Austin Monthly", url: "https://www.austinmonthly.com/7-fun-things-to-do-in-austin-this-weekend-oct-8-11/", long: "Austin Monthly published this Oct. 6 as its weekend list for Oct. 8 to 11. The lede is the second weekend of ACL Fest at Zilker, Friday through Sunday, after Weekend 1 already ran. The piece does not add a new lineup. It treats ACL as the thing the city is already doing again. The rest of the list is the local stack around it: Sign Bar's Fear Fair haunted maze at 9909 FM 969, open select days through Nov. 1, with an actor-free daytime walk if you do not want the jump scares. Saturday is the Texas-OU watch-party map, 2:30 p.m., with Fairmont Austin, Hole in the Wall, Scholz Garten, and Meanwhile Brewing named. Moe's Tavern, the Nickel City Simpsons pop-up, is at 1133 E. 11th through Oct. 31. Gruene Food and Wine Fest is the 40th year, Oct. 8 to 11, with Robert Earl Keen and Shane Smith and the Saints, plus a free Saturday tasting called Tastings and Tunes. Gibson Street's Twisted Carnival runs through Nov. 1 at 1109 S. Lamar. The Golden Girls Kitchen pop-up runs through Nov. 8 at 610 N. Interstate 35. Photo credit is Bryan C. Parker." },
  { title: "Gruene Food and Wine Fest starts today", read: "40th year, Oct. 8 to 11. Robert Earl Keen and Shane Smith and the Saints are on the bill.", phone: "Who drives to Gruene, and who says that is a Saturday?", source: "Austin Monthly", url: "https://www.austinmonthly.com/7-fun-things-to-do-in-austin-this-weekend-oct-8-11/", long: "This is item 5 in Austin Monthly's Oct. 8 to 11 weekend list, published Oct. 6. The fest is the 40th annual Gruene Food and Wine Fest. It runs four days, Oct. 8 to 11, in Gruene, with food, drinks, and concerts. The names Austin Monthly actually prints are Robert Earl Keen and Shane Smith and the Saints. The one specific freebie is Tastings and Tunes, a wine tasting on Saturday. The magazine links the official fest site, gruenemusicandwinefest.org, and does not print a full schedule or ticket price in the blurb. It sits in a list whose other items are ACL Weekend 2, the Fear Fair maze, Texas-OU watch parties, Moe's Tavern, Twisted Carnival, and the Golden Girls Kitchen." },
  { title: "Boo at the Zoo is back Friday and Saturday nights", read: "Austin Zoo, through Oct. 24. Kids in costume, train rides, and the haunted house after dark.", phone: "Who already has a costume?", source: "Visit Austin", url: "https://www.austintexas.org/events/october-and-november/", long: "Visit Austin's October and November calendar lists Boo at the Zoo as Oct. 2 through Oct. 24 at the Austin Zoo. The description says Friday and Saturday nights. Kids come in costume. The night includes train rides, musical entertainment, and unlimited haunted-house visits. It is the zoo after dark, not a daytime school trip. The same calendar page also lists ACL on Oct. 2 to 4 and Oct. 9 to 11 at Zilker, Austoberfest at Scholz Garten on Oct. 3, and the German-Texan Oktoberfest at the German Free School on Oct. 10." },
  { title: "Moe's Tavern is back on East 11th", read: "Nickel City's Simpsons pop-up runs through Oct. 31 at 1133 E. 11th. Krusty Burgers and Duff.", phone: "Who is going for the bit?", source: "Austin Monthly", url: "https://www.austinmonthly.com/7-fun-things-to-do-in-austin-this-weekend-oct-8-11/", long: "Austin Monthly lists this as item 4 in the Oct. 8 to 11 weekend guide, published Oct. 6. Nickel City is bringing the Simpsons bar back for another year. The pop-up is Moe's Tavern at 1133 E. 11th St., through Oct. 31, various times. The magazine names Krusty Burgers, Duff Beer, nostalgic decor, and bartenders dressed as characters. It is a returning Halloween pop-up, not a new restaurant. The line they use is 'Don't have a cow, man.' The Instagram they point to is Nickel City's." },
  { title: "Kacey Musgraves is at the Moody Center", read: "William Beckmann opens. Tour name is Middle of Nowhere. Hit New story if this already happened.", phone: "Who has tickets, and who is fine staying home?", source: "Ticketmaster", url: "https://www.ticketmaster.com/discover/austin?date=thismonth", long: "Ticketmaster's Austin October list shows Kacey Musgraves on the Middle of Nowhere Tour at Moody Center ATX, 2001 Robert Dedman Drive. The listing that was live on Oct. 7 put the show at 7:30 p.m. with tickets still available, from about $80. William Beckmann has been the opener on this run. If you are reading this after the show, the card is stale. Hit New story. The same Ticketmaster week also lists Role Model at Moody Amphitheater and Foreigner at the H-E-B Center in Cedar Park." }
];
const kickerPool = [
  { line: "Idaho cooked 1,474 pounds of French fries and broke a record.", more: "About 50 people, six fryers, old record was India.", source: "East Idaho News", url: "https://www.eastidahonews.com/2026/10/idaho-sets-new-guinness-world-record-for-largest-serving-of-french-fries/", long: "East Idaho News ran this at 2:56 p.m. on Oct. 7, credited to Victoria Rodriguez at KIVI in Boise. The Idaho Potato Commission and Spud Daddy set a Guinness record Friday night for the largest serving of french fries. The old mark was 1,452.85 pounds, set in India in 2018. Thomas Watson of Spud Daddy said the point was to bring the title back to Idaho. About 50 to 60 people cut and flash-froze the potatoes, then a refrigerated truck took them to the fryers. About 1,700 pounds of raw Idaho potatoes went in. The cooked weigh-in was 1,474 pounds, a little more than 20 pounds over the record. It happened at Potato Days at the Idaho Botanical Garden, which also had the Big Idaho Potato Truck, live music, lawn games, tots, mashed potatoes, loaded baked potatoes, and potato soup. After the weigh-in they served the fries. Watson's quote at the end is that he was ready for a nap and some of the fries." },
  { line: "A British grower beat his own pumpkin record. It weighed 2,856.8 pounds.", more: "Ian Paton named it Bagheera. Then it becomes cow feed.", source: "Guinness World Records", url: "https://www.guinnessworldrecords.com/news/2026/10/all-hail-pumpking-paton-british-grower-beats-his-own-record-with-giant-gourd", long: "Guinness published this Oct. 7, written by Adam Millward. Ian Paton, a nursery owner in Hampshire, grew a pumpkin that the Great Pumpkin Commonwealth weighed on Oct. 3 at 1,295.8 kg, or 2,856 pounds 12.8 ounces. His son named it Bagheera, after the panther in The Jungle Book. Last year Ian and his twin Stuart held the record with a pumpkin named Muggle at 2,819 pounds 4 ounces. Stuart retired after that. Ian grew this one alone, up to six hours a day for two months, in a greenhouse, because the UK had a hot summer. On the hottest days the plant got about 130 gallons of water, which Guinness compares to three bathtubs. He says a giant pumpkin can go from golf-ball size to this size in 120 days and put on as much as 70 pounds a day. Bagheera is heavier than Muggle, but Muggle is still bigger around. A second 2026 pumpkin, Baloo, weighed 2,773 pounds and was the second-heaviest ever without taking the record. Paton says he wants a 3,000-pound pumpkin next and has more than 2,600 seeds from Bagheera. It is on display at Sunnyfields Farm near Southampton through the end of October." },
  { line: "A stuffed Pikachu got a guided tour of the space station.", more: "Plush in an astronaut suit. 67 days up there.", source: "Dexerto", url: "https://www.dexerto.com/pokemon/pokemon-go-sent-pikachu-to-space-for-67-days-aboard-iss-3410420/", long: "Dexerto published this Sept. 19. A Pikachu plush spent 67 days on the International Space Station, about 1,040 orbits, from April 11 to June 17, 2026, flying with ESA astronaut Sophie Adenot. The trip is now the center of an official ESA and Pokemon Company exhibition for World Space Week, Oct. 4 to 10. The show mixes real European mission material with Pokemon panels. It starts at ESA open days in Paris, Rome, Noordwijk, Darmstadt, Villanueva de la Canada, and Harwell, then goes to the Science Museum in London, the Deutsches Museum in Nuremberg, and Lucca Comics and Games, running until April 2027. ESA director general Josef Aschbacher says the point is to get people in Europe to connect with space. In Pokemon Go, from Oct. 4, 2026 to April 30, 2027, Astronaut Pikachu shows up in one-star raids at six museums, including London, Toulouse, and Noordwijk. You can catch one with a location background. A shiny is possible. Field research is only Oct. 4 to 10. This is not the first Pokemon-in-orbit bit. Sword and Shield gave players a Kibo's Pikachu in 2020." },
  { line: "A carpenter found a wallet lost for 51 years.", more: "Under the floors in Nova Scotia. License, student ID, and a dollar.", source: "UPI", url: "https://www.upi.com/Odd_News/", long: "UPI's odd-news desk flagged this on Oct. 6 as a home-renovation find. A carpenter working under the floors of a house in Dartmouth, Nova Scotia, found a wallet that had been lost for 51 years. What has been reported inside: a license, a student ID, a birth certificate, a 1975 Hamlet ticket, and a dollar. A Facebook post reached the owner's wife. The owner, Richard Gilroy, is 68 now. The UPI item is a short oddity, not a long feature. The More here link goes to UPI's odd-news desk, where that item ran." },
  { line: "A kangaroo spent a day on the loose in Missouri.", more: "It got out of a petting zoo. Police and a bystander got it back.", source: "UPI", url: "https://www.upi.com/Odd_News/", long: "This is an odd-news item, not an Austin story. A kangaroo got out of a Missouri petting zoo and was loose for about a day. Police, animal control, and a bystander got it back. Nobody was reported hurt. Use it as a care-or-don't-care kicker. If you need the full writeup, More here opens UPI's odd-news desk." },
  { line: "An Idaho man tried to move 51 malt balls with a straw.", more: "One minute, two bowls, a record attempt.", source: "UPI", url: "https://www.upi.com/Odd_News/", long: "Odd-news record attempt. The task was to move 51 malt balls from one bowl to another in one minute, using only a straw. It is a Guinness-style bit, good for a kicker and a phone question about the dumb skill you would actually try. More here opens the UPI odd-news desk." },
  { line: "Police pulled over two men for driving an actual couch.", more: "North Carolina. Not a couch-shaped car. A couch.", source: "UPI", url: "https://www.upi.com/Odd_News/", long: "North Carolina police stopped two men who were driving a couch on the road. Not a car shaped like a couch. A couch. The ticket is the punch line. It is a kicker, not a local story. More here opens the UPI odd-news desk." },
  { line: "A shark cruised a flooded New Jersey driveway.", more: "After a nor'easter. It was a harmless smooth dogfish.", source: "UPI", url: "https://www.upi.com/Odd_News/", long: "After a nor'easter, a smooth dogfish about three to five feet long was swimming in a flooded New Jersey driveway. It is a harmless shark, not a great white. The picture is the bit. More here opens the UPI odd-news desk." }
];
const docPool = [
  { q: "What strange item permanently lives in your car?", how: "From the Doc. Caller names the object first. You two guess why." },
  { q: "What mundane thing hypnotizes you?", how: "From the Doc. Dirt grader, tortilla machine, car wash, lawn robot." },
  { q: "They sent me an Uber.", how: "From the Doc. What happened that made someone order the ride and send you away?" },
  { q: "Optimus gets one chore forever. What is it?", how: "From the Doc. Laundry, yard, dishes, or the H-E-B run." },
  { q: "Over-50 agility test: socks, one foot at a time.", how: "From the Doc. Do it in studio first." },
  { q: "That is not your pet.", how: "From the Doc. Raccoon, squirrel, deer, fox, armadillo." },
  { q: "Do your spouse. Then get the spouse on.", how: "From the Doc. 20 seconds. Then the spouse does the caller." },
  { q: "Empty your pockets.", how: "From the Doc. No warning. Most inexplicable item wins." }
];
const slots = ["s610", "s705", "s810"];
let open = localStorage.getItem("air-open") || "";
let longOpen = localStorage.getItem("air-long") || "";
let storySkip = JSON.parse(localStorage.getItem("air-story-skip") || "{}");
let kickerSkip = JSON.parse(localStorage.getItem("air-kicker-skip") || "[0,1,2,3]");
let benched = JSON.parse(localStorage.getItem("air-bench") || "[]");
let used = JSON.parse(localStorage.getItem("air-used") || "[]");
function save() {
  localStorage.setItem("air-open", open);
  localStorage.setItem("air-long", longOpen);
  localStorage.setItem("air-story-skip", JSON.stringify(storySkip));
  localStorage.setItem("air-kicker-skip", JSON.stringify(kickerSkip));
  localStorage.setItem("air-bench", JSON.stringify(benched));
  localStorage.setItem("air-used", JSON.stringify(used));
}
function storyFor(slot) {
  const n = storySkip[slot] || 0;
  const usedTitles = slots.filter(s => s !== slot).map(s => storyPool[(storySkip[s] || 0) % storyPool.length].title);
  let i = n;
  for (let k = 0; k < storyPool.length; k++) {
    const pick = storyPool[i % storyPool.length];
    if (!usedTitles.includes(pick.title)) return pick;
    i++;
  }
  return storyPool[n % storyPool.length];
}
function kickerAt(i) {
  const taken = kickerSkip.filter((n, idx) => idx !== i);
  let n = kickerSkip[i] || i;
  for (let k = 0; k < kickerPool.length; k++) {
    if (!taken.includes(n % kickerPool.length)) return kickerPool[n % kickerPool.length];
    n++;
  }
  return kickerPool[i % kickerPool.length];
}
function newStory(slot) { storySkip[slot] = (storySkip[slot] || 0) + 1; open = slot; longOpen = ""; save(); draw(); }
function newKicker(i) { kickerSkip[i] = (kickerSkip[i] || i) + 1; open = "cdc"; longOpen = ""; save(); draw(); }
function toggleLong(id) { longOpen = longOpen === id ? "" : id; save(); draw(); }
function available() { return docPool.filter(bit => !benched.includes(bit.q)); }
function pick(n) { const pool = available(); return pool[n] || pool[0] || docPool[0]; }
function bench(q) { if (!benched.includes(q)) benched.unshift(q); save(); draw(); }
function markUsed(q) { if (used.includes(q)) used = used.filter(x => x !== q); else used.push(q); save(); draw(); }
function toggle(id) { open = open === id ? "" : id; save(); draw(); }
function row(time, label, id, tag) {
  return `<button class="slot" onclick="toggle('${id}')"><span class="time">${time}</span><span>${label}</span><span class="tag">${tag}</span></button>`;
}
function sourceLine(item, id) {
  const more = longOpen === id ? `<div class="long"><p>${item.long}</p></div>` : "";
  return `<p class="src">${item.source}</p><div class="actions"><a class="btn ghost" href="${item.url}" target="_blank" rel="noopener">More here</a><button class="ghost" onclick="toggleLong('${id}')">${longOpen === id ? "Hide longer read" : "Longer read"}</button></div>${more}`;
}
function storyCard(slot, extra) {
  const s = storyFor(slot);
  return `<div class="panel"><h3>${s.title}</h3><p>${s.read}</p><p>Phone: ${s.phone}</p>${extra || ""}${sourceLine(s, "long-" + slot)}<div class="actions"><button onclick="newStory('${slot}')">New story</button></div></div>`;
}
function docCard(bit) {
  const struck = used.includes(bit.q) ? "text-decoration:line-through" : "";
  const q = bit.q.replace(/'/g, "");
  return `<div class="panel"><h3 style="${struck}">${bit.q}</h3><p>${bit.how}</p><div class="actions"><button onclick="markUsed('${q}')">${used.includes(bit.q) ? "Undo" : "Used"}</button><button class="ghost" onclick="bench('${q}')">Bench it</button></div></div>`;
}
function draw() {
  const a = storyFor("s610"), b = storyFor("s705"), c = storyFor("s810");
  const ks = [0,1,2,3].map(kickerAt);
  const d1 = pick(0), d2 = pick(1), d3 = pick(2), d4 = pick(3);
  const cdc = ks.map((k, i) => `<div class="kicker"><b>${k.line}</b><p>${k.more}</p><p><b>Care, or don’t care?</b></p>${sourceLine(k, "k" + i)}<button onclick="newKicker(${i})">New story</button></div>`).join("");
  document.getElementById("board").innerHTML = `
    <section class="hour"><h2>6:00</h2>
      ${row("6:00", "Intro, then the first thing that made Tricia laugh", "intro", "locked")}
      ${row("6:10", "Replay: " + a.title, "s610", "story")}
      ${open === "s610" ? storyCard("s610") : ""}
      ${row("6:25", "Replay from Yesterday", "replay", "locked")}
      ${row("6:35", "Tease: " + ks[0].line, "cdc", "tied")}
      ${row("6:40", "Care Don’t Care", "cdc", "open")}
      ${open === "cdc" ? `<div class="panel"><h3>Care Don’t Care</h3>${cdc}</div>` : ""}
      ${row("6:52", "Last Laugh", "laugh6", "locked")}
    </section>
    <section class="hour"><h2>7:00</h2>
      ${row("7:05", b.title + ". Then Minute to Win It setup.", "s705", "story")}
      ${open === "s705" ? storyCard("s705", "<p>Then the setup: Minute to Win It is at 7:10.</p>") : ""}
      ${row("7:10", "Minute to Win It", "m2w", "locked")}
      ${row("7:26", d1.q, "d1", "doc")}
      ${open === "d1" ? docCard(d1) : ""}
      ${row("7:32", "Phones if lit. Doc bit waits.", "phones7", "phones")}
      ${row("7:40", d2.q, "d2", "doc")}
      ${open === "d2" ? docCard(d2) : ""}
      ${row("7:52", "Last Laugh", "laugh7", "locked")}
    </section>
    <section class="hour"><h2>8:00</h2>
      ${row("8:05", "Tease: " + c.title, "s810", "tied")}
      ${row("8:10", c.title, "s810", "story")}
      ${open === "s810" ? storyCard("s810") : ""}
      ${row("8:26", d3.q, "d3", "doc")}
      ${open === "d3" ? docCard(d3) : ""}
      ${row("8:32", "Phones if lit. Doc bit waits.", "phones8", "phones")}
      ${row("8:40", d4.q, "d4", "doc")}
      ${open === "d4" ? docCard(d4) : ""}
      ${row("8:52", "Last Laugh", "laugh8", "locked")}
    </section>
    <p class="bench">Longer read summarizes the source page. More here opens it.</p>`;
}
draw();
</script>
