# BASIC_AUTH_USERS is set in the Netlify dashboard (env vars), not in git.
# Site-wide Basic-Auth is written into published _headers at deploy time.

[build]
  command = "node scripts/apply-basic-auth.js"
  publish = "."
  # Skip builds when only "Updated … CT" stamps changed (saves build credits).
  ignore = "bash scripts/netlify-ignore.sh"

[[edge_functions]]
  path = "/*"
  function = "auth"
