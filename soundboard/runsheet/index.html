<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Johnny's Run Sheet · Soundboard</title><style>
body{margin:0;background:#f6f7fb;color:#18202e;font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{background:#0b1220;color:#fff;padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:20px;flex:1}header h1 span{color:#ff6b2c}header a{color:#ffb38f}
main{max-width:1100px;margin:0 auto;padding:16px 20px 40px}
.note{color:#5b6576;font-size:14px;margin:0 0 12px}
h2{font-size:18px;margin:26px 0 8px;padding:6px 12px;background:#ff6b2c;color:#fff;border-radius:8px;display:inline-block}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px #0001}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid #e7eaf0;vertical-align:top}
th{background:#eef1f7;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#4a5568}
td.day{font-weight:700;white-space:nowrap;width:90px}td.name{font-weight:700;width:30%}td.file{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:#5b6576;width:26%;overflow-wrap:anywhere}
tr:nth-child(even) td{background:#fafbfd}.empty{color:#5b6576;background:#fff;padding:18px;border-radius:10px}
@media(max-width:700px){td.file{display:none}th.file{display:none}td.name{width:auto}}
</style></head><body>
<header><h1>Johnny's <span>Run Sheet</span></h1><a href="/soundboard/">← Soundboard</a></header>
<main><p class="note" id="stamp">Johnny's cuts on the soundboard, by the day they air. Updates automatically.</p><div id="out"><p class="empty">Loading…</p></div></main>
<script>
(function(){
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
  var DAYS=[["mon","Monday"],["tue","Tuesday"],["wed","Wednesday"],["thu","Thursday"],["fri","Friday"],["evergreen","Evergreen"]];
  var one=function(t){t=String(t||"").replace(/\s+/g," ").trim();var s=t.split(/(?<=[.!?])\s/)[0];return s.length>140?s.slice(0,137).replace(/\s+\S*$/,"")+"…":s;};
  Promise.all([fetch("/data/soundboard.json",{cache:"no-store"}).then(function(r){return r.json();}),fetch("/api/sb/state",{credentials:"same-origin"}).then(function(r){return r.ok?r.json():{overrides:{}};}).catch(function(){return{overrides:{}};})]).then(function(r){
    var ov=r[1].overrides||{}, rows=(r[0].clips||[]).filter(function(c){return c.source_name==="Johnny";}).map(function(c){var o=ov[c.id]||{};return{day:o.board||(String(c.tag).indexOf("day-")===0?c.tag.slice(4):c.air_day),title:o.title||c.title,file:c.filename,about:one(o.desc||c.desc||c.transcript),gone:o.trashedAt||o.gone};}).filter(function(x){return!x.gone;});
    var h="";
    DAYS.forEach(function(d){var rs=rows.filter(function(x){return x.day===d[0];});if(!rs.length)return;
      h+='<h2>'+d[1]+' · '+rs.length+'</h2><table><thead><tr><th>Day</th><th>New name</th><th class="file">Original file name</th><th>What it\'s about</th></tr></thead><tbody>'+rs.map(function(x){return'<tr><td class="day">'+d[1].slice(0,3)+'</td><td class="name">'+esc(x.title)+'</td><td class="file">'+esc(x.file)+'</td><td>'+esc(x.about)+'</td></tr>';}).join("")+'</tbody></table>';});
    document.getElementById("out").innerHTML=h||'<p class="empty">No Johnny cuts on the board right now.</p>';
  });
})();
</script></body></html>
